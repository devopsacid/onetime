name: release

# Runs on a version tag. Publishes the CLI files as a GitHub release with a keyless build
# provenance attestation (Sigstore, signed by this workflow's identity; no signing key exists).
#
# Verify a downloaded file:
#   gh attestation verify onetime.mjs --repo devopsacid/onetime
# (the same works for onetime.cmd and onetime.mjs.sha256; all three are attested)
# and, for download damage only, `sha256sum -c onetime.mjs.sha256`.
#
# Is the release file byte-identical to the one the site serves at /cli/onetime.mjs?
# Yes, for the same commit and the locked dependencies (same esbuild version). Checked: building
# from two different directories gave the same sha256. tools/build-cli.mjs embeds only the
# package.json version (and, for the Pages profile, no default-server define); there is no
# timestamp, no absolute path (no source map, legal comments off) and no random value. This job runs `pnpm build` (the Pages profile, same as `pnpm deploy`).
# It holds only while the deploy is built from the tagged commit with the locked dependencies;
# a deploy from a dirty tree or another commit differs. Compare with
# `sha256sum dist/cli/onetime.mjs` against https://onetimepass.pages.dev/cli/onetime.mjs.sha256.
# The self-host profile (ONETIME_SITE=selfhost) embeds the operator's origin and is not released here.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not reachable from origin/main" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version v$version" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # pnpm check leaves the Pages build in dist/ (the self-host build goes to dist-selfhost/).
      - run: sha256sum -c onetime.mjs.sha256
        working-directory: dist/cli
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: |
            dist/cli/onetime.mjs
            dist/cli/onetime.cmd
            dist/cli/onetime.mjs.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli
          path: cli
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cli/onetime.mjs
            cli/onetime.cmd
            cli/onetime.mjs.sha256
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" \
            --notes "CLI $TAG. Verify: gh attestation verify onetime.mjs --repo $REPO" \
            cli/onetime.mjs cli/onetime.cmd cli/onetime.mjs.sha256
