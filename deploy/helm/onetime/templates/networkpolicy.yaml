{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "onetime.fullname" . }}
  labels:
    {{- include "onetime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "onetime.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.denyEgress }}
    - Egress
    {{- end }}
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- if or .Values.networkPolicy.ingressFrom .Values.tests.enabled }}
      from:
        {{- with .Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.tests.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: test
        {{- end }}
      {{- end }}
  {{- if .Values.networkPolicy.denyEgress }}
  # The app makes no outbound connections.
  egress: []
  {{- end }}
{{- end }}
