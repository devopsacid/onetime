# Values for the onetime chart. See docs/deploy-helm.md.
#
# Rules that this chart enforces or relies on:
# - One replica only. The database is one SQLite file with an exclusive lock. Rendering fails for any other value.
# - The volume must be block or local storage (Azure Disk, EBS, GCE PD, Longhorn RWO, Ceph RBD, local-path).
#   Never NFS, EFS, Azure Files, CephFS or any ReadWriteMany class.
# - Nothing in front of the app may log request paths (they contain secret ids). See ingress.annotations below.

# Must stay 1. Any other value fails rendering (values.schema.json and the StatefulSet template).
replicaCount: 1

image:
  # Required. There is no published image: build it with your ONETIME_ORIGIN and push it to your registry.
  repository: ""
  # One of tag or digest is required. Prefer the digest ("sha256:..."); if both are set, both are used (repo:tag@digest).
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Run-time settings of the server (docs/self-hosting.md, "Run-time settings"). HOST, PORT and ONETIME_DB are set by the chart.
config:
  # Most unexpired secrets stored at once (ONETIME_MAX_STORED). Empty = server default (20000).
  maxStored: ""
  # Largest file in bytes (ONETIME_MAX_FILE_BYTES), 0..5242880 (5 MiB); 0 turns files off. The ingress body limit and
  # timeouts are derived from it (ingress.maxBodyBytes, ingress.proxyTimeoutSeconds). Files above 1 MiB need CLI 0.4.0.
  # Memory: each upload in progress is held about 3 times (about 16 MB at 5 MiB) and up to ONETIME_MAX_UPLOADS (default
  # 16) run at once, so 5 MiB files can take about 250 MB on top of the base: raise resources.limits.memory, or lower
  # extraEnv.ONETIME_MAX_UPLOADS (for example "4"), before raising this above 1 MiB.
  maxFileBytes: 262144
  # Longest life of a file in seconds (ONETIME_MAX_FILE_TTL), 60..604800. Default 1 hour, like the hosted service.
  maxFileTtl: 3600
  # Database file inside the volume. A subfolder, so the server creates it with mode 0700 itself (a volume root
  # often has group bits from fsGroup, or mode 0777 from local-path).
  dbPath: /data/db/onetime.db

# More environment variables as a map, for settings added later (for example ONETIME_MAX_CONNECTIONS: "200" or
# ONETIME_MAX_UPLOADS: "4"). HOST, PORT, ONETIME_DB, ONETIME_MAX_FILE_BYTES and ONETIME_MAX_FILE_TTL are reserved and
# rejected here (the last two are config.maxFileBytes and config.maxFileTtl).
extraEnv: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # The app never talks to the Kubernetes API. The token is not mounted (also on the pod).
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Matches the Dockerfile and compose.yaml: uid 1000, read-only root, no capabilities, no privilege escalation.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# The server finishes requests in flight for up to 8 s after SIGTERM.
terminationGracePeriodSeconds: 15

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  pathType: Prefix
  # Name of the TLS secret for host. Leave empty when TLS is done by the load balancer (EKS with ACM, GKE managed certificates).
  tlsSecretName: ""
  certManager:
    # Adds cert-manager.io/cluster-issuer (or issuer) so cert-manager fills tlsSecretName.
    enabled: false
    issuerName: ""
    issuerKind: ClusterIssuer
  # Largest request body the proxy accepts, in bytes. Empty = derived from config.maxFileBytes: the largest blob
  # (262,562 bytes for 256 KiB files, 5,243,298 at 5 MiB, 16,418 with files off) plus 3 %, rounded up to the next
  # 100 KiB: 307200 (300 KiB) by default, 5427200 (5300 KiB) at 5 MiB, 102400 with files off. A number overrides it;
  # rendering fails if it is below the largest blob (the proxy would refuse the largest allowed file). The app refuses
  # larger bodies with 413 itself. For ingress-nginx classes (className containing "nginx", or
  # webapprouting.kubernetes.azure.com) the chart sets nginx.ingress.kubernetes.io/proxy-body-size from it, unless that
  # annotation is given below. The Traefik Middleware in values-k3s-traefik.yaml uses it too.
  maxBodyBytes: ""
  # Proxy read and send timeout in seconds. Empty = derived from config.maxFileBytes: the app's own upload timeout
  # (60 s plus 1 s per 32 KiB of blob above 16 KB) plus 10 s, rounded up to 10 s: 80 by default, 230 at 5 MiB, 70 with
  # files off, so a large file on a slow line is not cut off by the proxy before the app answers. The chart sets
  # nginx.ingress.kubernetes.io/proxy-read-timeout and proxy-send-timeout (ingress-nginx) and the GKE BackendConfig
  # timeoutSec from it, unless those annotations are given below. Other controllers have their own timeouts: see
  # docs/deploy-helm.md ("Large files").
  proxyTimeoutSeconds: ""
  # Controller-specific annotations. Access logs must stay off; see the files in deploy/helm/examples/.
  annotations: {}

persistence:
  # false = emptyDir: every restart deletes all stored secrets. For tests only.
  enabled: true
  # Use an existing PVC instead of the StatefulSet's volumeClaimTemplate. It must be RWO block or local storage.
  existingClaim: ""
  # Empty = the cluster's default class. Must be block or local storage, never NFS/EFS/Azure Files/RWX.
  storageClass: ""
  # ReadWriteOncePod is stricter (one pod, not one node) but needs a CSI driver; local-path does not support it.
  accessModes: [ReadWriteOnce]
  size: 1Gi
  annotations: {}

# Memory: the server holds each upload in progress about 3 times (3 x the blob: under 1 MB at the 256 KiB default,
# about 16 MB at 5 MiB), times ONETIME_MAX_UPLOADS (default 16) at once. 256Mi is enough up to about 1 MiB files with
# the defaults. With larger files raise limits.memory (5 MiB with 16 uploads: about 250 MB on top of the base, so 384Mi
# or more) or lower extraEnv.ONETIME_MAX_UPLOADS (for example "4").
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

probes:
  startup:
    periodSeconds: 2
    failureThreshold: 30
    timeoutSeconds: 3
  liveness:
    periodSeconds: 20
    failureThreshold: 3
    timeoutSeconds: 3
  readiness:
    periodSeconds: 10
    failureThreshold: 2
    timeoutSeconds: 3

networkPolicy:
  enabled: false
  # Who may connect to port 8080. Each entry is a NetworkPolicy "from" peer. Typical: the ingress controller namespace.
  # With AWS ALB target-type ip, the source is the load balancer's address in the VPC: use an ipBlock with the VPC CIDR.
  ingressFrom: []
  # The app makes no outbound connections. true = deny all egress (DNS included).
  denyEgress: true

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

# GKE only: Ingress-created load balancers log every request by default. This BackendConfig turns that off and sets the
# health check to /healthz. Needs the cloud.google.com/v1 BackendConfig CRD (GKE).
gke:
  backendConfig:
    enabled: false
  # Google-managed certificate for ingress.host and an HTTP-to-HTTPS redirect (networking.gke.io CRDs, GKE only).
  managedCertificate:
    enabled: false
  frontendConfig:
    enabled: false

# helm test: a pod running the app image's busybox wget against /healthz (no extra image).
tests:
  enabled: true

# Extra manifests rendered as they are (strings are passed through tpl). For controller CRDs such as a Traefik Middleware.
extraObjects: []
