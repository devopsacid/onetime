---
# Node 22.13 or newer for systemd mode.

- name: Install the NodeSource repository prerequisites (Debian, Ubuntu)
  ansible.builtin.apt:
    name: [ca-certificates, python3-debian]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: onetime_node_install == "nodesource" and ansible_facts["os_family"] == "Debian"

- name: Add the NodeSource repository (Debian, Ubuntu)
  ansible.builtin.deb822_repository:
    name: nodesource
    types: deb
    uris: "https://deb.nodesource.com/node_{{ onetime_node_major }}.x"
    suites: nodistro
    components: main
    signed_by: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
  register: onetime_nodesource_deb
  when: onetime_node_install == "nodesource" and ansible_facts["os_family"] == "Debian"

- name: Add the NodeSource repository (RHEL family)
  ansible.builtin.yum_repository:
    name: nodesource-nodejs
    description: NodeSource Node.js {{ onetime_node_major }}.x
    baseurl: "https://rpm.nodesource.com/pub_{{ onetime_node_major }}.x/nodistro/nodejs/$basearch"
    gpgkey: https://rpm.nodesource.com/gpgkey/ns-operations-public.key
    gpgcheck: true
    module_hotfixes: true
    enabled: true
  when: onetime_node_install == "nodesource" and ansible_facts["os_family"] == "RedHat"

- name: Install nodejs (Debian, Ubuntu)
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: "{{ onetime_nodesource_deb is changed }}"
  when: onetime_node_install != "none" and ansible_facts["os_family"] == "Debian"

- name: Install nodejs (RHEL family)
  ansible.builtin.dnf:
    name: nodejs
    state: present
  when: onetime_node_install != "none" and ansible_facts["os_family"] == "RedHat"

- name: Read the Node version
  ansible.builtin.command:
    argv: ["{{ onetime_node_bin }}", --version]
  register: onetime_node_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Check that Node is 22.13 or newer
  ansible.builtin.assert:
    that:
      - onetime_node_version.rc == 0
      - onetime_node_version.stdout | regex_replace('^v', '') is version('22.13.0', '>=')
    fail_msg: >-
      {{ onetime_node_bin }} must be Node 22.13 or newer (found: {{ onetime_node_version.stdout | default('none') }}).
      Use onetime_node_install=nodesource, or install Node yourself and set onetime_node_bin.
    quiet: true
  when: not ansible_check_mode or onetime_node_version.rc == 0
