apiVersion: v1
kind: Service
metadata:
  name: {{ include "onetime.fullname" . }}
  labels:
    {{- include "onetime.labels" . | nindent 4 }}
  {{- if or .Values.service.annotations .Values.gke.backendConfig.enabled }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- include "onetime.stringMap" . | nindent 4 }}
    {{- end }}
    {{- if .Values.gke.backendConfig.enabled }}
    cloud.google.com/backend-config: {{ printf "{\"default\": \"%s\"}" (include "onetime.fullname" .) | quote }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "onetime.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
# Governing headless Service of the StatefulSet (required by spec.serviceName).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "onetime.fullname" . }}-headless
  labels:
    {{- include "onetime.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "onetime.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
